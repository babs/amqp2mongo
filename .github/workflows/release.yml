name: "Build OCI Image"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref: re-pushing or re-dispatching the same tag cancels
# the stale run instead of racing it onto the shared floating tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPOS: "ghcr.io/babs/amqp2mongo"

jobs:
  test:
    name: "Lint + E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:5.0          # MongoDB 5.0 API == the DocDB 5.0 target
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RABBITMQ_URL: "amqp://guest:guest@localhost:5672/%2F?heartbeat=30"
      MONGODB: "mongodb://localhost:27017/amqp2mongo?retryWrites=false"
      RABBITMQ_CONS_EXCH: "consume"
      RABBITMQ_CONS_QUEUE: "e2e.all-msgs"
      RABBITMQ_CONS_ROUTING_KEYS: "#"
      MONGOCOLLECTION: "amqp2mongo"
      PREFETCH: "200"            # drain 10k fast against a local mongo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: npm ci

      - name: Lint + syntax
        run: |
          npm run check
          npm run lint

      - name: E2E — 10k messages through the bridge
        run: |
          set -euo pipefail
          node test/e2e.js setup
          node amqp2mongo.js > bridge.log 2>&1 &
          BRIDGE=$!
          for i in $(seq 1 30); do
            grep -q 'Waiting for msgs' bridge.log && break
            # surface a crash early instead of waiting the full loop
            kill -0 "$BRIDGE" 2>/dev/null || { echo "bridge exited during startup"; cat bridge.log; exit 1; }
            sleep 1
          done
          grep -q 'Waiting for msgs' bridge.log || { echo "bridge not ready"; cat bridge.log; exit 1; }
          node test/e2e.js publish 10000
          node test/e2e.js verify 10000
          kill "$BRIDGE" 2>/dev/null || true

  build-image:
    name: "Build OCI image"
    needs: test
    # master pushes and PRs only run the test gate; images ship from tags or manual dispatch.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30          # fail fast instead of hanging the 360 min default
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    outputs:
      RAW_IMG_TAGS: ${{ steps.define-targets.outputs.RAW_IMG_TAGS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Define TARGETS
        id: define-targets
        run: |
          PLATFORM=${{ matrix.platform }}
          PLATFORM_PAIR=${PLATFORM//\//-}
          echo "PLATFORM_PAIR=$PLATFORM_PAIR" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          IMG_TAGS="latest"

          if [ ${GITHUB_REF_TYPE:-} == 'tag' -a -n "$(echo $GITHUB_REF_NAME | grep -iE '^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$')" ]; then
            TAG=${GITHUB_REF_NAME#v}
            RELEASE=""
            case "$TAG" in
              *-*)
                RELEASE="-${TAG#*-}"
                ;;
            esac
            SEMVER_CORE="${TAG%%-*}"
            IMG_TAGS="${IMG_TAGS} $TAG ${SEMVER_CORE%.*}${RELEASE} ${SEMVER_CORE%%.*}${RELEASE}"
          fi
          echo RAW_IMG_TAGS="$IMG_TAGS" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          echo "Targets:"
          TARGETS=""
          for REPO in $REPOS; do
            for IMG_TAG in $IMG_TAGS; do
              TARGETS="${TARGETS},${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
              echo "- ${REPO}:${IMG_TAG}-$PLATFORM_PAIR"
            done
          done
          echo TARGETS=${TARGETS#,} | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

          VERSION=${VERSION:-$GITHUB_REF_NAME}
          VERSION=${VERSION:-v0.0.0}
          COMMIT_HASH="$(git rev-parse --short HEAD 2>/dev/null)"
          COMMIT_HASH=${COMMIT_HASH:-00000000}
          DIRTY=$(git diff --quiet 2>/dev/null || echo '-dirty')
          echo "VERSION=${VERSION}" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV
          echo "COMMIT_HASH=${COMMIT_HASH}${DIRTY}" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV
          echo "BUILD_TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a $GITHUB_OUTPUT >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }}
            PROJECT_URL=${{ github.event.repository.html_url }}
            BUILDER=github-actions/${{ runner.os }}-${{ runner.arch }}
          # GHA cache scoped per-platform so amd64/arm64 don't evict each other.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          push: true
          tags: ${{ env.TARGETS }}
          platforms: ${{ matrix.platform }}
          # SLSA provenance + SBOM embedded in the OCI index. NOTE: this makes
          # each build push an INDEX, which is why merge-images must use
          # `docker buildx imagetools` (not `docker manifest`) below.
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          echo "✅ Docker image created:" | tee -a $GITHUB_STEP_SUMMARY
          for TGT in ${TARGETS//,/\ }; do
            echo " - $TGT" | tee -a $GITHUB_STEP_SUMMARY
          done

  merge-images:
    name: "Merge platform images into one"
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # create the GitHub Release below
      packages: write
      id-token: write          # keyless cosign, only this job holds it
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --metadata-file on imagetools create needs a recent buildx.
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Merge, sign and tag the multi-arch index
        # imagetools (not `docker manifest`) — per-platform builds carry
        # provenance/sbom as an OCI index; `docker manifest create` rejects
        # those, imagetools merges them and preserves the attestations.
        env:
          IMG_TAGS: ${{ needs.build-image.outputs.RAW_IMG_TAGS }}
          ISSUER: https://token.actions.githubusercontent.com
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          retry() { for i in 1 2 3; do "$@" && return 0; echo "retry $i failed: $*" >&2; sleep $((i * 5)); done; return 1; }
          # Merge once, from the run's most specific tag (the full version on a tag run):
          # `latest-linux-*` is shared with dispatch runs and can be moved under us.
          read -ra TAGS <<< "$IMG_TAGS"
          SRC=${TAGS[1]:-${TAGS[0]}}
          for REPO in $REPOS; do
            # Fail loud if a per-platform child is missing (e.g. a matrix leg
            # failed) rather than merging a stale tag from a previous run.
            retry docker buildx imagetools inspect "$REPO:$SRC-linux-amd64" >/dev/null
            retry docker buildx imagetools inspect "$REPO:$SRC-linux-arm64" >/dev/null
            # imagetools needs a tag to push to. Scratch tag, moved every run: never deploy it.
            retry docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" \
              -t "$REPO:unsigned-staging" \
              "$REPO:$SRC-linux-amd64" \
              "$REPO:$SRC-linux-arm64"
            DIGEST=$(jq -re '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
            # --recursive also signs each platform image: without it a pull by
            # platform digest has no signature.
            retry cosign sign --yes --recursive "${REPO}@${DIGEST}"
            retry cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "${REPO}@${DIGEST}" >/dev/null
            # Public tags move only after the signature verifies.
            for IMG_TAG in $IMG_TAGS; do
              retry docker buildx imagetools create -t "$REPO:$IMG_TAG" "${REPO}@${DIGEST}"
              GOT=$(retry docker buildx imagetools inspect "$REPO:$IMG_TAG" --format '{{json .Manifest}}' | jq -r .digest)
              [[ "$GOT" == "$DIGEST" ]] || { echo "::error::$REPO:$IMG_TAG is $GOT, not the signed $DIGEST"; exit 1; }
              echo "signed $REPO:$IMG_TAG @ $DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
            done
          done

      # Preinstalled gh CLI instead of a third-party release action.
      # Only on tag pushes; skipped on workflow_dispatch.
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            echo "Release ${GITHUB_REF_NAME} already exists; skipping."
          fi
